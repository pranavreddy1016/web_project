<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Booking | Reddy Tours</title>
    <link rel="stylesheet" href="/css/booking.css">
</head>
<body>

     <nav class="navbar">
        <div class="nav-left">
            
            <ul>
                <li><a href="/HTML/packages.html" class="active">Return</a></li>
                
            </div>
            </div>

    </nav>


    
    <div class="booking-box">
        <h1>Tour Booking</h1>
        <form id="bookingForm">
            <label>Selected Tour</label>
            <input type="text" id="tour">
            <label>Package Price</label>
            <input type="text" id="price">
            <label>Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" required>
            <label>Travel Date</label>
            <input type="date" id="date" required>
            <label>Number of Persons</label>
            <input type="number" id="persons" min="1" placeholder="Enter number of persons" required>

            <button type="submit">
                Submit Booking
            </button>
        </form>

    </div>


    <script src="/js/booking.js"></script>

</body>

</html>
